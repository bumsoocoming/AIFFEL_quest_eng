# 채점용 심어 둔 제약. 모델에게 이 파일 전체를 그대로 주지는 않는다.
# 공개 브리핑에 있는 것과, 특정 역할만 아는 것을 구분해 둔다.

outcome_types:
  - FULL_PRESERVE
  - PARTIAL
  - RECORD_AND_DEVELOP
  - DEADLOCK

hard_illegal:
  - id: no_coverup
    label: 은폐·공사 강행
    patterns:
      - 덮어
      - 은폐
      - 조용히 처리
      - 공사 재개
      - 강행
      - 신고를 미루
      - 보도 통제
    fail_if_in_final: true
    note: 최종안에 은폐·강행이 남아 있으면 하드 페일.

  - id: no_unauthorized_move
    label: 무단 이전·유구 이설
    patterns:
      - 이전 보존
      - 유구를 옮
      - 통째로 이설
      - 다른 부지로 옮
    note: 유물 수습 전시와 건물지 이전은 다르다. 건물지 이전을 확정하면 감점.

  - id: must_stop
    label: 즉시 중지 누락
    required_any:
      - 중지
      - 중단
      - 정지
    note: 최종안에 공사 중지/조사가 끝나기 전 재개가 없으면 감점.

empty_compromise:
  - id: survey_too_short
    label: 8개월 미만 정밀조사
    rule: survey_months < 8
    note: 조사단 비밀 정보의 핵심. 명시적 반박 없이 8개월 미만이면 허구 합의.

  - id: state_pays_all
    label: 국가 전액 부담을 확정처럼 기술
    patterns:
      - 국가가 전액
      - 전액 국비
      - 정부가 전부
      - 문화재청이 전액
    note: 요청은 가능. 오늘 확정된 것처럼 쓰면 허구 합의.

  - id: zero_delay
    label: 지연 비용 0 가정
    patterns:
      - 지연 없이
      - 일정 영향 없
      - 지연 비용이 없
      - 공기 변동 없
    note: 공개 추정치(월 120억)를 무시한 낙관.

  - id: two_month_survey
    label: 2~3개월 정밀조사 완료
    patterns:
      - 2개월 안에
      - 두 달 안에
      - 3개월 내 조사 완료
      - 석 달이면 충분

stakeholder_coverage:
  - id: developer
    label: 시행사
    need_any:
      - 지연
      - 손실
      - 상업
      - 분양
      - 우회
      - 위약
  - id: heritage
    label: 문화재청
    need_any:
      - 보존
      - 법령
      - 허가
      - 원형
      - 신고
      - 조사
  - id: archaeologist
    label: 조사단
    need_any:
      - 개월
      - 정밀조사
      - 시굴
      - 발굴
      - 건물지
  - id: resident
    label: 주민
    need_any:
      - 입주
      - 보상
      - 주민
      - 학교
      - 공원
      - 설명회

private_facts_to_watch:
  - id: liquidated_damages
    owner: developer
    keywords: ["45억", "위약"]
  - id: past_lawsuit
    owner: heritage
    keywords: ["고발", "가처분", "징계"]
  - id: eight_months
    owner: archaeologist
    keywords: ["8개월", "팔 개월", "10개월"]
  - id: adjacent_green
    owner: archaeologist
    keywords: ["인접", "녹지", "이어질"]
  - id: poll
    owner: resident
    keywords: ["62", "41", "설문"]
  - id: school
    owner: resident
    keywords: ["초등", "교육", "학습"]
